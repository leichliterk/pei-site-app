<div class="flex flex-col h-full bg-slate-100">
  <!-- Header Toolbar -->
  <p-toolbar styleClass="bg-primary-500 border-none rounded-none shadow-md">
    <ng-template #start>
      <div class="flex flex-col">
        <span class="text-xl font-semibold text-white">PEI Data Services</span>
        <span class="text-sm text-blue-100">Site: {{environment.siteNumber}} - {{environment.siteName}}</span>
      </div>
    </ng-template>

    <ng-template #end>
      <div class="flex items-center gap-3">
        
        <p-button
          icon="pi pi-home"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          pTooltip="Home"
          tooltipPosition="bottom"
          (click)="navigateToHome()"
          styleClass="text-white hover:bg-white/20" />
        <p-button
          icon="pi pi-cog"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          pTooltip="Settings"
          tooltipPosition="bottom"
          (click)="navigateToSettings()"
          styleClass="text-white hover:bg-white/20" />
      </div>
    </ng-template>
  </p-toolbar>

  <!-- Main Content -->
  <main class="flex-1 overflow-auto p-4">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer for non-Electron warning -->
  @if (!electronService.isElectronApp) {
    <footer class="p-3 bg-amber-50 border-t border-amber-200">
      <p-message severity="warn" text="This app requires Electron to access file system" styleClass="w-full" />
    </footer>
  }
</div>
