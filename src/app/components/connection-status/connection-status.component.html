<div class="flex flex-row justify-between items-center gap-4">
  <p-tag
    [severity]="getTagSeverity()"
    [icon]="getTagIcon()"
    [value]="getStatusText()"
    (click)="onStatusClick()"
    pTooltip="Click to go to settings"
    tooltipPosition="bottom"
    class="cursor-pointer select-none" />
  <span class="text-sm text-gray-500">{{ getLastConnectionTime() }}</span>
</div>
