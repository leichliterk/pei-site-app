<div class="h-full p-4">
  <h2 class="text-2xl font-semibold text-gray-800 mb-4">Statistics</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
    <!-- Uptime Card -->
    <p-card header="Uptime" styleClass="shadow-md">
      @if (isLoading) {
        <div class="flex justify-center items-center py-4">
          <p-progressSpinner strokeWidth="4" styleClass="w-12 h-12" />
        </div>
      } @else if (connectionLogs.length === 0) {
        <div class="text-center py-4">
          <i class="pi pi-info-circle text-2xl text-gray-400 mb-2"></i>
          <p class="text-gray-500">No connection data available</p>
        </div>
      } @else {
        <div class="flex flex-col gap-4">
          <!-- Uptime Percentage -->
          <div class="text-center">
            <span class="text-4xl font-bold" [class]="getUptimePercentage() >= 90 ? 'text-green-600' : getUptimePercentage() >= 70 ? 'text-yellow-600' : 'text-red-600'">
              {{ getUptimePercentage() }}%
            </span>
            <p class="text-sm text-gray-500 mt-1">Overall Uptime</p>
          </div>

          <!-- Stats -->
          <div class="flex justify-between border-t pt-4">
            <div class="text-center">
              <p-tag severity="success" [value]="getSuccessCount().toString()" />
              <p class="text-xs text-gray-500 mt-1">Successful</p>
            </div>
            <div class="text-center">
              <p-tag severity="danger" [value]="getFailureCount().toString()" />
              <p class="text-xs text-gray-500 mt-1">Failed</p>
            </div>
            <div class="text-center">
              <p-tag severity="info" [value]="connectionLogs.length.toString()" />
              <p class="text-xs text-gray-500 mt-1">Total</p>
            </div>
          </div>
        </div>
      }
    </p-card>
  </div>

  <!-- Connection History Chart -->
  @if (!isLoading && connectionLogs.length > 0) {
    <p-card header="Connection History" styleClass="shadow-md">
      <div class="h-64">
        <p-chart type="line" [data]="chartData" [options]="chartOptions" />
      </div>
    </p-card>
  }
</div>
