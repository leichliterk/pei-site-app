<div class="h-full p-8">
  <!-- Main Content -->
  <div class="flex flex-col items-center justify-center h-full gap-6">
    <!-- Server Connection Card -->
    <p-card header="Server Connection" styleClass="shadow-md w-[65%]">
      <div class="flex flex-col gap-4">
        <!-- Status Row -->
        <div class="flex items-center justify-between">
          <span class="text-gray-600">Status</span>
          <p-tag
            [severity]="getStatusSeverity()"
            [icon]="getStatusIcon()"
            [value]="getStatusText()" />
        </div>

        <!-- Connected At Row -->
        <div class="flex items-center justify-between">
          <span class="text-gray-600">Connected At</span>
          <span class="font-medium">
            @if (connectedAt) {
              {{ connectedAt | date:'medium' }}
            } @else {
              --
            }
          </span>
        </div>

        <!-- Uptime Row -->
        <div class="flex items-center justify-between">
          <span class="text-gray-600">Current Uptime</span>
          <span class="font-medium">{{ currentUptime }}</span>
        </div>
      </div>
    </p-card>

    <!-- FTP Status Card -->
    <p-card header="FTP Status" styleClass="shadow-md w-[65%]">
      <div class="flex flex-col gap-3">
        <app-ftp-status></app-ftp-status>
      </div>
    </p-card>
  </div>
</div>
