<div class="h-full p-8">
  <!-- Main Content -->
  <div class="flex flex-col items-center justify-center h-full gap-6">
    <!-- Server Connection Card -->
    <p-card header="Server Connection" styleClass="shadow-md w-[65%]">
      <div class="flex flex-col gap-4">
        <!-- Status Row -->
        <div class="flex items-center justify-between">
          <span class="text-gray-600">Status</span>
          <p-tag
            [severity]="getStatusSeverity()"
            [icon]="getStatusIcon()"
            [value]="getStatusText()" />
        </div>

        <!-- Connected At Row -->
        <div class="flex items-center justify-between">
          <span class="text-gray-600">Connected At</span>
          <span class="font-medium">
            @if (connectedAt) {
              {{ connectedAt | date:'medium' }}
            } @else {
              --
            }
          </span>
        </div>

        <!-- Uptime Row -->
        <div class="flex items-center justify-between">
          <span class="text-gray-600">Current Uptime</span>
          <span class="font-medium">{{ currentUptime }}</span>
        </div>

        <!-- Connection History Chart -->
        <div class="mt-4 pt-4 border-t border-gray-200">
          <span class="text-gray-600 text-sm">Connection History (Last 5 minutes)</span>
          <div class="mt-2">
            <p-chart type="line" [data]="chartData" [options]="chartOptions" height="100%" />
          </div>
        </div>
      </div>
    </p-card>

    <!-- FTP Status Card -->
    <p-card header="FTP Status" styleClass="shadow-md w-[65%]">
      <div class="flex flex-col gap-3">
        <app-ftp-status></app-ftp-status>
      </div>
    </p-card>
  </div>
</div>
